<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sage · Signpost — Personal Site</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }

  #site-name .name { font-size: 15px; font-weight: 600; letter-spacing: 0.3em; }
  #site-name .sub  { margin-top: 7px; font-size: 10px; letter-spacing: 0.32em; color: rgba(255, 255, 255, 0.65); }

             background: #fff; color: #c9c9c9; font-size: 11px; letter-spacing: 0.4em;
             transition: opacity 0.6s ease; z-index: 10; }
  #loading.done { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="app"></div>
<div id="ui">
  <div id="site-name"><div class="name">SAGE</div><div class="sub">PERSONAL SITE</div></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Sky } from 'three/addons/objects/Sky.js';

/* ==========================================================
   Editable configuration
   ----------------------------------------------------------
   - SIGN_DEFS: one entry per sign (shape / height / angle /
     arm length / size / placeholder image).
     shape: hrect | vrect | square | circle | triangle | arrow
     (arrow = rectangle ending in an arrowhead pointing outward;
      arm = short neck keeping the board clear of the pole, with
      the rod bridging the gap so boards read as grown from it).
   - Set `image` to a path or URL to replace the generated
     placeholder. Aspect ratio close to w:h looks best.
   - Angles are collision-free against the default sizes;
     if you resize boards, keep some clearance between them.
   ========================================================== */
const SITE = { name: 'SAGE', sub: 'PERSONAL SITE' };

const SIGN_DEFS = [
  { shape: 'arrow',    y:  1.25, angle:  30, arm: 0.28, w: 2.90, h: 0.80, focus: 'bottom', label: 'ABOUT',    colorA: '#a8c8e8', colorB: '#e3eefb', image: null },
  { shape: 'circle',   y:  3.30, angle:  55, arm: 0.00, w: 1.90, h: 1.90, centered: true, label: 'WORKS', colorA: '#f2c9a0', colorB: '#fbeadb', image: null },
  { shape: 'arrow',    y: -0.10, angle: 148, arm: 0.24, w: 2.55, h: 0.80, focus: 'top', label: 'PROJECTS', colorA: '#9fd0b8', colorB: '#e2f4ea', image: null },
  { shape: 'arrow',    y:  2.35, angle: 208, arm: 0.40, w: 2.30, h: 0.80, focus: 'bottom', label: 'BLOG',     colorA: '#e8a8a8', colorB: '#fae6e6', image: null },
  { shape: 'arrow',    y: -1.35, angle: 258, arm: 0.30, w: 2.70, h: 0.80, focus: 'bottom', label: 'GALLERY',  colorA: '#c3b2e0', colorB: '#ece5f8', image: null },
  { shape: 'hrect',    y:  0.70, angle: 326, arm: 0.00, w: 4.80, h: 1.10, centered: true, label: '2026', colorA: '#a0cfd8', colorB: '#e0f2f6', image: null },
  { shape: 'arrow',    y: -0.65, angle: 352, arm: 0.32, w: 2.45, h: 0.80, focus: 'top', label: 'CONTACT',  colorA: '#d8c8a8', colorB: '#f5eddd', image: null },
];

/* ---------------- Renderer / scene / camera ---------------- */
const app = document.getElementById('app');
document.querySelector('#site-name .name').textContent = SITE.name;
document.querySelector('#site-name .sub').textContent = SITE.sub;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xffffff, 0);           // transparent canvas, pure white comes from CSS
renderer.toneMapping = THREE.ACESFilmicToneMapping;
app.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);

// Environment map gives the metal parts real reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.HemisphereLight(0xffffff, 0xe9e9e9, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(4, 7, 5);
scene.add(dirLight);
// Soft light following the camera so edge-on signs never go fully dark
const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
fillLight.position.set(0, 0, 1);
camera.add(fillLight);
scene.add(camera);

/* ---------------- Time-of-day sky (dawn / day / dusk) ---------------- */
// The wheel drives skyState.t (0 dawn · 1 day · 2 dusk). The day look is the
// page CSS gradient plus the drifting cloud layer; at dawn and dusk a Three.js
// Sky atmosphere mesh fades in instead.
const sky = new Sky();
sky.scale.setScalar(60);
let skyFadePatched = false;
{
  const m = sky.material;
  const patched = m.fragmentShader.replace(
    /gl_FragColor\s*=\s*vec4\(\s*(\w+)\s*,\s*1\.0\s*\)\s*;/,
    (match, name) => 'gl_FragColor = vec4(' + name + ', u_skyFade);'
  );
  if (patched !== m.fragmentShader) {
    m.fragmentShader = 'uniform float u_skyFade;\n' + patched;
    m.uniforms.u_skyFade = { value: 0 };   // registered so applySkyPhase can drive it
    m.transparent = true;
    skyFadePatched = true;
  }
}
sky.visible = false;
scene.add(sky);
const skyU = sky.material.uniforms;

function smoothstepJS(a, b, x) {
  const k = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1);
  return k * k * (3 - 2 * k);
}
function lerpNum(a, b, k) { return a + (b - a) * k; }

// atmospheric parameter sets per the reference look
const SKY_DAWN = { t: 12, r: 3, m: 0.005, g: 0.7, elev: 5, az: 160 };
const SKY_DUSK = { t: 14, r: 3, m: 0.005, g: 0.85, elev: 3, az: 180 };   // sun just above the horizon
const skyState = { t: 1, target: 1 };          // start at mid-day
window.__SKY_STATE__ = skyState;               // console access: set .t/.target (0 dawn · 1 day · 2 dusk)
window.__errs = [];
addEventListener('error', (e) => { window.__errs.push(e.message + ' @ ' + e.lineno); });
addEventListener('unhandledrejection', (e) => { window.__errs.push(String(e.reason)); });

function applySkyPhase() {
  const T = skyState.t;
  const k = THREE.MathUtils.clamp((T - 0.35) / 1.3, 0, 1);   // dawn → dusk morph
  skyU['turbidity'].value = lerpNum(SKY_DAWN.t, SKY_DUSK.t, k);
  skyU['rayleigh'].value = lerpNum(SKY_DAWN.r, SKY_DUSK.r, k);
  skyU['mieCoefficient'].value = lerpNum(SKY_DAWN.m, SKY_DUSK.m, k);
  skyU['mieDirectionalG'].value = lerpNum(SKY_DAWN.g, SKY_DUSK.g, k);
  skyU['sunPosition'].value.setFromSphericalCoords(
    1, THREE.MathUtils.degToRad(90 - lerpNum(SKY_DAWN.elev, SKY_DUSK.elev, k)),
    THREE.MathUtils.degToRad(lerpNum(SKY_DAWN.az, SKY_DUSK.az, k)));
  // the atmosphere mesh shows at dawn and dusk; the day plateau is the CSS gradient + clouds
  const fade = Math.max(
    1 - smoothstepJS(0.35, 0.70, T),
    smoothstepJS(1.30, 1.65, T)
  );
  sky.visible = fade > 0.005 && skyFadePatched;
  if (skyFadePatched) skyU['u_skyFade'].value = fade;
  renderer.toneMappingExposure = lerpNum(1.0, 0.45, fade);

  // cloud shader sun glow only while the gradient backdrop is showing
  cloudMat.uniforms.u_dayMix.value = 1 - fade;
}

/* Cloud layer: a large transparent plane carrying the drifting-cloud shader,
 * parked between the signpost (in front of it) and the sky dome (behind it). */
const CLOUD_VERT = 'varying vec2 v_uv;\nvoid main() {\n  v_uv = uv;\n  gl_Position = vec4(position.xy, 0.99, 1.0);   // NDC z 0.99: behind the signs, in front of the sky dome\n}\n';
const CLOUD_FRAG = '\nprecision highp float;\n\nvarying vec2 v_uv;\n\nuniform vec2 u_res;\nuniform float u_time;\nuniform float u_count;\nuniform vec3 u_cloud;\nuniform vec3 u_sky;\nuniform float u_dayMix;\n\nconst mat2 R = mat2(0.80, 0.60, -0.60, 0.80);\n\nfloat hash(vec2 p) {\n  return fract(sin(dot(p, vec2(41.31, 289.17))) * 26737.367);\n}\n\nfloat vnoise(vec2 p) {\n  vec2 i = floor(p);\n  vec2 f = fract(p);\n  f = f * f * (3.0 - 2.0 * f);\n  float a = hash(i);\n  float b = hash(i + vec2(1.0, 0.0));\n  float c = hash(i + vec2(0.0, 1.0));\n  float d = hash(i + vec2(1.0, 1.0));\n  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);\n}\n\nfloat fbm(vec2 p) {\n  float sum = 0.0;\n  float amp = 0.5;\n  for (int i = 0; i < 4; i++) {\n    sum += amp * vnoise(p);\n    p = R * p * 2.03 + 19.19;\n    amp *= 0.5;\n  }\n  return sum;\n}\n\nfloat billow(vec2 p) {\n  float sum = 0.0;\n  float amp = 0.5;\n  for (int i = 0; i < 5; i++) {\n    sum += amp * (1.0 - abs(2.0 * vnoise(p) - 1.0));\n    p = R * p * 2.11 + 13.37;\n    amp *= 0.5;\n  }\n  return sum;\n}\n\nfloat cloudDensity(vec2 p, vec2 c, vec2 r, float seed, float t) {\n  vec2 q = p - c;\n  float ry = q.y > 0.0 ? r.y : r.y * 0.42;\n  float env = 1.0 - length(vec2(q.x / r.x, q.y / ry));\n  if (env < -0.35) return 0.0;\n  vec2 dp = q * (2.4 / r.x) + seed;\n  dp += 0.6 * vec2(\n    fbm(dp * 1.4 + t * 0.04),\n    fbm(dp * 1.4 + 7.7 - t * 0.03)\n  );\n  float detail = billow(dp * 1.6);\n  return env + (detail - 0.62) * 0.62;\n}\n\nvoid cloudPass(inout vec4 acc, vec2 p, float aspect, float t,\n               float spd, float phase, float y, vec2 r, float seed, float dist) {\n  float cx = mix(-r.x - 0.25, aspect + r.x + 0.25, fract(t * spd + phase));\n  float cy = y + sin(t * 0.05 + phase * 6.2831) * 0.012;\n  float d = cloudDensity(p, vec2(cx, cy), r, seed, t);\n  if (d < 0.02) return;\n  float dUp = cloudDensity(p + vec2(0.0, r.y * 0.55), vec2(cx, cy), r, seed, t);\n  float occl = clamp((dUp - d) * 1.1 + d * 0.55, 0.0, 1.0);\n  vec3 lit = u_cloud * 1.04;\n  vec3 shadow = mix(u_cloud * 0.60, u_sky, 0.38);\n  vec3 cloudCol = mix(lit, shadow, occl * 0.85);\n  float a = smoothstep(0.02, 0.38, d);\n  float rim = smoothstep(0.02, 0.14, d) * (1.0 - smoothstep(0.14, 0.40, d));\n  cloudCol += rim * 0.10;\n  cloudCol = mix(cloudCol, u_sky, dist * 0.35);\n  a *= mix(1.0, 0.8, dist);\n  acc.rgb = mix(acc.rgb, cloudCol, a);\n  acc.a = a + acc.a * (1.0 - a);\n}\n\nvoid main() {\n  float aspect = u_res.x / u_res.y;\n  vec2 p = vec2(v_uv.x * aspect, v_uv.y);\n  float t = u_time;\n  vec4 acc = vec4(0.0, 0.0, 0.0, 0.0);\n\n  // soft sun glow, day only\n  if (u_dayMix > 0.001) {\n    vec2 sunPos = vec2(aspect * 0.78, 0.92);\n    float sunDist = length(p - sunPos);\n    float glow = exp(-sunDist * sunDist * 5.0) * 0.16 * u_dayMix;\n    acc.rgb += vec3(1.0, 0.95, 0.82) * glow;\n    acc.a = max(acc.a, glow);\n  }\n\n  // drifting clouds, every time of day (never changes with the phases)\n  if (u_count > 5.5) cloudPass(acc, p, aspect, t, 0.006, 0.10, 0.84, vec2(0.20, 0.10), 43.7, 1.0);\n  if (u_count > 4.5) cloudPass(acc, p, aspect, t, 0.008, 0.62, 0.73, vec2(0.24, 0.12), 71.3, 0.85);\n  if (u_count > 3.5) cloudPass(acc, p, aspect, t, 0.011, 0.33, 0.60, vec2(0.34, 0.16), 17.3, 0.55);\n  if (u_count > 2.5) cloudPass(acc, p, aspect, t, 0.013, 0.80, 0.47, vec2(0.30, 0.15), 29.9, 0.45);\n  if (u_count > 1.5) cloudPass(acc, p, aspect, t, 0.016, 0.05, 0.35, vec2(0.46, 0.20), 91.1, 0.15);\n  cloudPass(acc, p, aspect, t, 0.020, 0.48, 0.20, vec2(0.56, 0.24), 57.2, 0.0);\n\n  gl_FragColor = acc;\n}\n';
const cloudMat = new THREE.ShaderMaterial({
  vertexShader: CLOUD_VERT,
  fragmentShader: CLOUD_FRAG,
  transparent: true,
  depthWrite: false,
  depthTest: true,
  premultipliedAlpha: true,      // the shader writes premultiplied cloud color
  uniforms: {
    u_res: { value: new THREE.Vector2(innerWidth, innerHeight) },
    u_time: { value: 0 },
    u_count: { value: 6 },
    u_cloud: { value: new THREE.Color('#fbf8f2') },
    u_sky: { value: new THREE.Color(0.42, 0.62, 0.85) },
    u_dayMix: { value: 1 }
  }
});
const cloudQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), cloudMat);   // 2x2 = fullscreen in clip space
cloudQuad.renderOrder = 5;
cloudQuad.frustumCulled = false;
scene.add(cloudQuad);



/* ---------------- Materials ---------------- */
// procedural concrete: pale gray base with restrained mottling and faint
// weathering streaks — clean from a distance, subtly detailed up close
function makeConcreteCanvas() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#9a9a98';
  ctx.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 900; i++) {
    const x = Math.random() * 128, y = Math.random() * 128;
    const r = 0.3 + Math.random() * 1.6;
    const a = Math.random() * 0.08;
    ctx.fillStyle = Math.random() < 0.5
      ? 'rgba(255,255,255,' + a + ')'
      : 'rgba(45,45,45,' + a + ')';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  for (let i = 0; i < 10; i++) {
    const y = Math.random() * 128;
    const a = Math.random() * 0.05;
    ctx.fillStyle = 'rgba(30,30,30,' + a + ')';
    ctx.fillRect(0, y, 128, 0.6 + Math.random() * 1.2);
  }
  return c;
}
const concreteCanvas = makeConcreteCanvas();
const poleTex = new THREE.CanvasTexture(concreteCanvas);
poleTex.wrapS = poleTex.wrapT = THREE.RepeatWrapping;
poleTex.repeat.set(2, 6);
poleTex.colorSpace = THREE.SRGBColorSpace;
poleTex.anisotropy = 4;
const rodTex = new THREE.CanvasTexture(concreteCanvas);
rodTex.colorSpace = THREE.SRGBColorSpace;
rodTex.anisotropy = 4;
const matConcrete    = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, metalness: 0.0, map: poleTex }); // pole body / cap
const matConcreteRod = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, metalness: 0.0, map: rodTex });  // mounting necks
const matDarkMetal = new THREE.MeshStandardMaterial({ color: 0x7d8084, metalness: 0.7,  roughness: 0.4  }); // clamp rings (metallic gray, not black)
const matLightMetal= new THREE.MeshStandardMaterial({ color: 0xbfc2c6, metalness: 0.9,  roughness: 0.3  }); // back plate / frame
const matWire      = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.6, metalness: 0.2 }); // overhead wires

/* ---------------- Pole and clamp rings ---------------- */
const POLE_H = 8.6, POLE_R = 0.13, BOARD_D = 0.07, FRAME_W = 0.09, FRAME_D = 0.05;
const UP = new THREE.Vector3(0, 1, 0);
const ORIGIN = new THREE.Vector3(0, 0, 0);
const TARGET0 = new THREE.Vector3(0, 1.4, 0);   // orbit pivot (raised so the pole sits lower, with headroom)

const root = new THREE.Group();                  // whole installation (rotated/shifted while focused)
scene.add(root);

const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.15, POLE_H, 28), matConcrete);
root.add(pole);
const cap = new THREE.Mesh(new THREE.SphereGeometry(0.12, 28, 18), matConcrete);

cap.scale.y = 0.5;
cap.position.y = POLE_H / 2;
root.add(cap);

/* ---------------- Shape helpers ---------------- */
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  r = Math.min(r, w / 2, h / 2);
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function circleShape(r) {
  const s = new THREE.Shape();
  s.absarc(0, 0, r, 0, Math.PI * 2, false);
  return s;
}
function roundedPolygonShape(points, radius) {
  const shape = new THREE.Shape();
  const n = points.length;
  for (let i = 0; i < n; i++) {
    const p = points[i], prev = points[(i - 1 + n) % n], next = points[(i + 1) % n];
    const d1 = new THREE.Vector2().subVectors(prev, p);
    const d2 = new THREE.Vector2().subVectors(next, p);
    const r1 = Math.min(radius, d1.length() * 0.5);
    const r2 = Math.min(radius, d2.length() * 0.5);
    const a = p.clone().addScaledVector(d1.normalize(), r1);
    const b = p.clone().addScaledVector(d2.normalize(), r2);
    if (i === 0) shape.moveTo(a.x, a.y); else shape.lineTo(a.x, a.y);
    shape.quadraticCurveTo(p.x, p.y, b.x, b.y);
  }
  shape.closePath();
  return shape;
}
function triangleShape(side, corner) {
  const Rc = side / Math.sqrt(3);   // circumradius, apex up, centered on the centroid
  return roundedPolygonShape([
    new THREE.Vector2(0, Rc),
    new THREE.Vector2(-side / 2, -Rc / 2),
    new THREE.Vector2(side / 2, -Rc / 2),
  ], corner);
}
function makeOutline(def) {
  switch (def.shape) {
    case 'hrect':
    case 'vrect':   return roundedRectShape(def.w, def.h, 0.06);
    case 'square':  return roundedRectShape(def.w, def.h, 0.1);
    case 'circle':  return circleShape(def.w / 2);
    case 'triangle':return triangleShape(def.w, 0.16);
    case 'arrow': {                              // rectangle ending in an outward arrowhead (+x)
      const a = Math.min(0.55, def.h * 0.6);
      return roundedPolygonShape([
        new THREE.Vector2(-def.w / 2, -def.h / 2),
        new THREE.Vector2(def.w / 2 - a, -def.h / 2),
        new THREE.Vector2(def.w / 2, 0),
        new THREE.Vector2(def.w / 2 - a, def.h / 2),
        new THREE.Vector2(-def.w / 2, def.h / 2),
      ], 0.05);
    }
  }
}
// Metal frame: outer contour with the board outline as its hole (FRAME_W wide)
function makeFrameGeometry(def, outline) {
  let outer;
  switch (def.shape) {
    case 'hrect':
    case 'vrect':   outer = roundedRectShape(def.w + 2 * FRAME_W, def.h + 2 * FRAME_W, 0.06 + FRAME_W); break;
    case 'square':  outer = roundedRectShape(def.w + 2 * FRAME_W, def.h + 2 * FRAME_W, 0.1 + FRAME_W); break;
    case 'circle':  outer = circleShape(def.w / 2 + FRAME_W); break;
    case 'triangle': {
      const Rin = def.w / (2 * Math.sqrt(3));   // inradius; a uniform outward offset equals scaling about the centroid
      const k = (Rin + FRAME_W) / Rin;
      outer = triangleShape(def.w * k, 0.16 * k);
      break;
    }
    case 'arrow': {
      const L = def.w + 2 * FRAME_W;
      const H = def.h + 2 * FRAME_W;
      const a = Math.min(0.55, def.h * 0.6) + FRAME_W;
      outer = roundedPolygonShape([
        new THREE.Vector2(-L / 2, -H / 2),
        new THREE.Vector2(L / 2 - a, -H / 2),
        new THREE.Vector2(L / 2, 0),
        new THREE.Vector2(L / 2 - a, H / 2),
        new THREE.Vector2(-L / 2, H / 2),
      ], 0.05 + FRAME_W);
      break;
    }
  }
  outer.holes.push(outline);
  return new THREE.ExtrudeGeometry(outer, { depth: FRAME_D, bevelEnabled: false, curveSegments: 48 });
}
// ShapeGeometry UVs are raw coordinates; normalize them to 0-1 so the image fills the face
function normalizeUVs(geo) {
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const sx = Math.max(1e-6, bb.max.x - bb.min.x);
  const sy = Math.max(1e-6, bb.max.y - bb.min.y);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) {
    uv.setXY(i, (pos.getX(i) - bb.min.x) / sx, (pos.getY(i) - bb.min.y) / sy);
  }
  uv.needsUpdate = true;
}

/* ---------------- Generated placeholder textures ---------------- */
// Multiply a hex color by a factor (used to deepen the placeholder gradients)
function shadeHex(hex, f) {
  var n = parseInt(hex.slice(1), 16);
  var r = Math.round(((n >> 16) & 255) * f);
  var g = Math.round(((n >> 8) & 255) * f);
  var b = Math.round((n & 255) * f);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function textureAspect(def) {
  if (def.shape === 'circle' || def.shape === 'square') return 1;
  if (def.shape === 'triangle') return Math.sqrt(3) / 2;
  return def.h / def.w;
}
function makePlaceholderTexture(def, index) {
  const W = 640, H = Math.round(W * textureAspect(def));
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, shadeHex(def.colorA, 0.9));
  g.addColorStop(1, shadeHex(def.colorB, 0.9));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // font sizes clamped by canvas height so very flat boards don't overflow
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '700 ' + Math.min(Math.round(W * 0.4), Math.round(H * 0.7)) + 'px "Avenir Next", Arial, sans-serif';
  ctx.fillText(String(index + 1).padStart(2, '0'), W / 2, H * 0.46);
  ctx.fillStyle = 'rgba(35,35,35,0.85)';
  ctx.font = '600 ' + Math.min(Math.round(W * 0.055), Math.round(H * 0.18)) + 'px "Avenir Next", Arial, sans-serif';
  ctx.fillText(def.label.split('').join(' '), W / 2, H * 0.8);
  ctx.fillStyle = 'rgba(35,35,35,0.4)';
  ctx.font = '500 ' + Math.min(Math.round(W * 0.03), Math.round(H * 0.12)) + 'px "Avenir Next", Arial, sans-serif';
  ctx.fillText('R E P L A C E   M E', W / 2, H * 0.13);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

/* ---------------- Assemble the signs ---------------- */
const signs = [];        // { pivot, group, anchor, def }
const pickMeshes = [];   // meshes participating in ray picking

SIGN_DEFS.forEach((def, i) => {
  const outline = makeOutline(def);

  const pivot = new THREE.Group();               // orientation around the pole
  pivot.rotation.y = THREE.MathUtils.degToRad(def.angle);
  pivot.position.y = def.y;
  root.add(pivot);

  // Horizontal rod lying IN the board's plane: from the pole out to the board's inner edge.
  // Centered boards (def.centered) sit straight on the pole instead, held by two studs.
  const zOff = POLE_R + 0.02;                    // board back plane sits just outside the pole
  const centered = !!def.centered;
  const innerX = POLE_R + def.arm;               // board inner edge
  const groupX = centered ? 0 : innerX + def.w / 2;

  const mountMeshes = [];
  if (centered) {
    const studGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.12, 12);
    [-1, 1].forEach((s) => {
      const stud = new THREE.Mesh(studGeo, matConcreteRod);
      stud.rotation.x = Math.PI / 2;
      stud.position.set(s * 0.1, 0, POLE_R + 0.01);
      pivot.add(stud);
      mountMeshes.push(stud);
    });
  } else {
    const rodLen = def.arm + 0.10;               // embeds into the pole and the board edge
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, rodLen, 16), matConcreteRod);
    rod.rotation.z = Math.PI / 2;
    rod.position.set((POLE_R - 0.06 + innerX + 0.04) / 2, 0, zOff + BOARD_D / 2);
    pivot.add(rod);
    mountMeshes.push(rod);
  }

  const group = new THREE.Group();               // board space: +z faces outward
  group.position.set(groupX, 0, zOff);
  pivot.add(group);

  // Board body (thin, the back face doubles as the light-gray metal back plate)
  const body = new THREE.Mesh(
    new THREE.ExtrudeGeometry(outline, { depth: BOARD_D, bevelEnabled: false, curveSegments: 48 }),
    matLightMetal
  );
  group.add(body);

  // Front face image on its own ShapeGeometry, avoiding ExtrudeGeometry's raw UVs
  const frontGeo = new THREE.ShapeGeometry(outline, 48);
  normalizeUVs(frontGeo);
  const frontMat = new THREE.MeshStandardMaterial({
    map: makePlaceholderTexture(def, i),
    roughness: 0.85,
    metalness: 0.0,
    envMapIntensity: 0.3,
  });
  if (def.image) {
    new THREE.TextureLoader().load(def.image, (t) => {
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 8;
      frontMat.map = t;
      frontMat.needsUpdate = true;
    });
  }
  const front = new THREE.Mesh(frontGeo, frontMat);
  front.position.z = BOARD_D + 0.002;
  group.add(front);

  // Light-gray metal frame, embedded into the board and slightly raised
  const frame = new THREE.Mesh(makeFrameGeometry(def, outline), matLightMetal);
  frame.position.z = BOARD_D + 0.03 - FRAME_D;
  group.add(frame);

  // Anchor at the board center: target of the focus animation
  const anchor = new THREE.Object3D();
  anchor.position.z = BOARD_D / 2;
  group.add(anchor);

  // Dark-gray clamp ring where the arm meets the pole
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.1, 36), matDarkMetal);
  ring.position.y = def.y;
  root.add(ring);

  [body, front, frame, ...mountMeshes].forEach((m) => {
    m.userData.signIndex = i;
    pickMeshes.push(m);
  });
  signs.push({ pivot, group, anchor, def });
});

/* ---------------- Controls: horizontal orbit only ---------------- */
function sphericalPos(az, dist) {
  return new THREE.Vector3(Math.sin(az) * dist, TARGET0.y, Math.cos(az) * dist);
}
function currentAzimuth() {
  return Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
}
function shortestAngle(d) {
  return Math.atan2(Math.sin(d), Math.cos(d));
}
function easeInOutCubic(k) {
  return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
}
function easeOutCubic(k) {
  return 1 - Math.pow(1 - k, 3);
}

const controls = new OrbitControls(camera, canvas);
controls.target.copy(TARGET0);
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.rotateSpeed = 0.55;
controls.minPolarAngle = Math.PI / 2;   // vertical angle locked
controls.maxPolarAngle = Math.PI / 2;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.enableZoom = false;           // the wheel drives the time of day instead
controls.enabled = false;               // enabled after the intro

/* ---------------- State machine and tweens ---------------- */
let mode = 'intro';        // intro | overview | focus | animating
let focused = -1;
let savedView = null;      // overview view captured before the first focus

const anims = new Set();
function animate(dur, onUpdate, onDone, ease = easeInOutCubic) {
  const a = { start: performance.now(), dur, onUpdate, onDone, ease };
  anims.add(a);
  return a;
}
function stepAnims(now) {
  for (const a of [...anims]) {
    const k = Math.min(1, (now - a.start) / a.dur);
    a.onUpdate(a.ease(k), k);
    if (k >= 1) {
      anims.delete(a);
      if (a.onDone) a.onDone();
    }
  }
}
function focusDistance(def) {
  return Math.max(def.w, def.h) * 1.35 + 1.55;
}

/* Intro: dolly the camera in */
camera.position.copy(sphericalPos(0.349, 15.5));
camera.lookAt(TARGET0);
animate(1400, (e) => {
  camera.position.lerpVectors(sphericalPos(0.349, 15.5), sphericalPos(0.349, 11.5), e);
  camera.lookAt(TARGET0);
}, () => {
  mode = 'overview';
  controls.enabled = true;
  controls.update();
}, easeOutCubic);

/* Focus: turn the whole rig, slide it left, face the board */
function focusSign(i) {
  if (mode === 'animating' || mode === 'intro') return;
  if (mode === 'focus' && i === focused) return;
  if (mode === 'overview') savedView = { az: currentAzimuth(), dist: camera.position.distanceTo(TARGET0) };

  focused = i;
  const def = signs[i].def;
  const a = THREE.MathUtils.degToRad(def.angle);
  const camAz = currentAzimuth();          // keep the camera heading, bring the rig around

  const R0 = root.rotation.y;
  const P0 = root.position.clone();
  let R1 = camAz - a;                      // so the sign normal points at camAz
  R1 = R0 + shortestAngle(R1 - R0);        // shortest path: back-side clicks turn to the front

  // Slide the rig left along the camera-right axis; the sign stays centered
  const shift = def.w * 0.55 + 1.2;
  const P1 = new THREE.Vector3(-Math.cos(camAz) * shift, 0, Math.sin(camAz) * shift);

  // Board center in root coordinates (side-mounted boards hang off the pole;
  // centered boards sit straight on it)
  const cxL = def.centered ? 0 : POLE_R + def.arm + def.w / 2;
  const czL = POLE_R + 0.02 + BOARD_D / 2;
  const anchorRoot = new THREE.Vector3(
    cxL * Math.cos(a) + czL * Math.sin(a),
    def.y,
    -cxL * Math.sin(a) + czL * Math.cos(a)
  );
  const anchorAt = (R, P) => anchorRoot.clone().applyAxisAngle(UP, R).add(P);

  let D = focusDistance(def);
  const center1 = anchorAt(R1, P1);

  // Per-sign focus placement: aim the camera beside the board so it sits
  // off-center ('top' = upper-left, keeping bottom-right free for text;
  // 'bottom' = lower-left, keeping top-right free). Centered boards ignore it.
  let targetOffset = new THREE.Vector3(0, 0, 0);
  if (def.focus === 'top' || def.focus === 'bottom') {
    const dir = def.focus === 'top' ? -1 : 1;   // aim below (sign rises) or above (sign sinks)
    const right = new THREE.Vector3(Math.cos(camAz), 0, -Math.sin(camAz));
    targetOffset.addScaledVector(UP, dir * 0.95);
    targetOffset.addScaledVector(right, 0.55);
    D += 0.5;                                   // a little extra distance so nothing clips
  }
  const target1 = center1.clone().add(targetOffset);
  const camPos1 = target1.clone().add(new THREE.Vector3(Math.sin(camAz) * D, 0, Math.cos(camAz) * D));

  const startPos = camera.position.clone();
  const startTgt = controls.target.clone();

  anims.clear();
  controls.enabled = false;
  mode = 'animating';

  animate(1150, (e) => {
    root.rotation.y = R0 + (R1 - R0) * e;
    root.position.lerpVectors(P0, P1, e);
    const center = anchorAt(root.rotation.y, root.position).add(targetOffset);   // target follows the board live
    camera.position.lerpVectors(startPos, camPos1, e);
    controls.target.lerpVectors(startTgt, center, e);
    camera.lookAt(controls.target);
  }, () => {
    mode = 'focus';
  });
}

/* Exit focus: restore the view saved before focusing */
function unfocus() {
  if (mode !== 'focus') return;
  const v = savedView || { az: 0.349, dist: 11.5 };
  const endPos = sphericalPos(v.az, v.dist);
  const startPos = camera.position.clone();
  const startTgt = controls.target.clone();
  const R0 = root.rotation.y;
  const P0 = root.position.clone();

  anims.clear();
  mode = 'animating';
  focused = -1;

  animate(1050, (e) => {
    root.rotation.y = R0 * (1 - e);
    root.position.lerpVectors(P0, ORIGIN, e);
    camera.position.lerpVectors(startPos, endPos, e);
    controls.target.lerpVectors(startTgt, TARGET0, e);
    camera.lookAt(controls.target);
  }, () => {
    mode = 'overview';
    focused = -1;
    controls.enabled = true;
    controls.update();
  });
}

/* ---------------- Picking (click vs drag) ---------------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downX = 0, downY = 0, downId = -1, dragged = false;

function raycastSign(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickMeshes, false);
  return hits.length ? hits[0].object.userData.signIndex : -1;
}
function pick(e) {
  if (mode === 'animating' || mode === 'intro') return;
  const i = raycastSign(e);
  if (i >= 0) {
    focusSign(i);            // clicking a sign focuses or switches focus
  } else if (mode === 'focus') {
    unfocus();               // clicking empty space exits
  }
}
canvas.addEventListener('pointerdown', (e) => {
  if (!e.isPrimary) return;
  downX = e.clientX; downY = e.clientY;
  downId = e.pointerId;
  dragged = false;
});
canvas.addEventListener('pointermove', (e) => {
  if (e.isPrimary && e.pointerId === downId &&
      Math.hypot(e.clientX - downX, e.clientY - downY) > 6) dragged = true;
  if (mode === 'animating' || mode === 'intro') { canvas.style.cursor = 'default'; return; }
  canvas.style.cursor = raycastSign(e) >= 0 ? 'pointer' : (mode === 'overview' ? 'grab' : 'default');
});
canvas.addEventListener('pointerup', (e) => {
  if (!e.isPrimary || e.pointerId !== downId) return;
  downId = -1;
  if (dragged) return;
  pick(e);
});
canvas.addEventListener('pointercancel', () => { downId = -1; });
addEventListener('keydown', (e) => { if (e.key === 'Escape') unfocus(); });

/* ---------------- Wheel: dawn → day → dusk ---------------- */
addEventListener('wheel', (e) => {
  // slow progression: it takes several scrolls to move to the next phase
  skyState.target = THREE.MathUtils.clamp(
    skyState.target + THREE.MathUtils.clamp(e.deltaY, -180, 180) * 0.0009, 0, 2);
}, { passive: true });

/* ---------------- Main loop ---------------- */
renderer.setAnimationLoop((now) => {
  stepAnims(now);
  if (mode === 'overview') controls.update();   // camera is tween-driven otherwise

  // time-of-day: dawn → day → dusk
  skyState.t += (skyState.target - skyState.t) * Math.min(1, 0.05);
  applySkyPhase();

  // the cloud quad is fullscreen in clip space; its NDC depth (0.5) sits
  // naturally behind the signpost and in front of the sky dome
  cloudMat.uniforms.u_time.value = now / 1000;

  renderer.render(scene, camera);
});
document.getElementById('loading').classList.add('done');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  cloudMat.uniforms.u_res.value.set(innerWidth, innerHeight);
});

// Debug handle (available in the console)
window.__SIGNPOST_DEBUG__ = { scene, camera, controls, root, signs, pickMeshes, raycaster };
</script>
</body>
</html>
