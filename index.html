<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sage · Signpost — Personal Site</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff; }
  body { font-family: "Avenir Next", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; }
  #site-name { position: absolute; top: 30px; left: 36px; color: #111; }
  #site-name .name { font-size: 15px; font-weight: 600; letter-spacing: 0.3em; }
  #site-name .sub  { margin-top: 7px; font-size: 10px; letter-spacing: 0.32em; color: #9a9a9a; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             background: #fff; color: #c9c9c9; font-size: 11px; letter-spacing: 0.4em;
             transition: opacity 0.6s ease; z-index: 10; }
  #loading.done { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div id="site-name"><div class="name">SAGE</div><div class="sub">PERSONAL SITE</div></div>
</div>
<div id="loading">LOADING</div>
<script src="sky.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ==========================================================
   Editable configuration
   ----------------------------------------------------------
   - SIGN_DEFS: one entry per sign (shape / height / angle /
     arm length / size / placeholder image).
     shape: hrect | vrect | square | circle | triangle | arrow
     (arrow = rectangle ending in an arrowhead pointing outward;
      arm = short neck keeping the board clear of the pole, with
      the rod bridging the gap so boards read as grown from it).
   - Set `image` to a path or URL to replace the generated
     placeholder. Aspect ratio close to w:h looks best.
   - Angles are collision-free against the default sizes;
     if you resize boards, keep some clearance between them.
   ========================================================== */
const SITE = { name: 'SAGE', sub: 'PERSONAL SITE' };

const SIGN_DEFS = [
  { shape: 'arrow',    y:  1.25, angle:  30, arm: 0.28, w: 2.90, h: 0.80, label: 'ABOUT',    colorA: '#a8c8e8', colorB: '#e3eefb', image: null },
  { shape: 'circle',   y:  3.30, angle:  20, arm: 0.00, w: 1.90, h: 1.90, centered: true, label: 'WORKS', colorA: '#f2c9a0', colorB: '#fbeadb', image: null },
  { shape: 'arrow',    y: -0.10, angle: 148, arm: 0.24, w: 2.55, h: 0.80, label: 'PROJECTS', colorA: '#9fd0b8', colorB: '#e2f4ea', image: null },
  { shape: 'arrow',    y:  2.35, angle: 208, arm: 0.40, w: 2.30, h: 0.80, label: 'BLOG',     colorA: '#e8a8a8', colorB: '#fae6e6', image: null },
  { shape: 'arrow',    y: -1.35, angle: 258, arm: 0.30, w: 2.70, h: 0.80, label: 'GALLERY',  colorA: '#c3b2e0', colorB: '#ece5f8', image: null },
  { shape: 'hrect',    y:  0.70, angle: 326, arm: 0.00, w: 4.80, h: 1.10, centered: true, label: '2026', colorA: '#a0cfd8', colorB: '#e0f2f6', image: null },
  { shape: 'arrow',    y: -0.65, angle: 352, arm: 0.32, w: 2.45, h: 0.80, label: 'CONTACT',  colorA: '#d8c8a8', colorB: '#f5eddd', image: null },
];

/* ---------------- Renderer / scene / camera ---------------- */
const app = document.getElementById('app');
document.querySelector('#site-name .name').textContent = SITE.name;
document.querySelector('#site-name .sub').textContent = SITE.sub;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xffffff, 0);           // transparent canvas, pure white comes from CSS
renderer.toneMapping = THREE.ACESFilmicToneMapping;
app.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);

// Environment map gives the metal parts real reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.HemisphereLight(0xffffff, 0xe9e9e9, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(4, 7, 5);
scene.add(dirLight);
// Soft light following the camera so edge-on signs never go fully dark
const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
fillLight.position.set(0, 0, 1);
camera.add(fillLight);
scene.add(camera);

/* ---------------- Materials ---------------- */
const matBlack     = new THREE.MeshStandardMaterial({ color: 0x151515, metalness: 0.4,  roughness: 0.55 }); // pole / arms
const matDarkMetal = new THREE.MeshStandardMaterial({ color: 0x3a3a3c, metalness: 0.85, roughness: 0.35 }); // clamp rings
const matLightMetal= new THREE.MeshStandardMaterial({ color: 0xbfc2c6, metalness: 0.9,  roughness: 0.3  }); // back plate / frame

/* ---------------- Pole and clamp rings ---------------- */
const POLE_H = 8.6, POLE_R = 0.13, BOARD_D = 0.07, FRAME_W = 0.09, FRAME_D = 0.05;
const UP = new THREE.Vector3(0, 1, 0);
const ORIGIN = new THREE.Vector3(0, 0, 0);
const TARGET0 = new THREE.Vector3(0, 0.15, 0);   // orbit pivot

const root = new THREE.Group();                  // whole installation (rotated/shifted while focused)
scene.add(root);

const pole = new THREE.Mesh(new THREE.CylinderGeometry(POLE_R, POLE_R, POLE_H, 40), matBlack);
root.add(pole);
const cap = new THREE.Mesh(new THREE.SphereGeometry(POLE_R, 32, 16), matBlack);
cap.scale.y = 0.5;
cap.position.y = POLE_H / 2;
root.add(cap);

/* ---------------- Shape helpers ---------------- */
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  r = Math.min(r, w / 2, h / 2);
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function circleShape(r) {
  const s = new THREE.Shape();
  s.absarc(0, 0, r, 0, Math.PI * 2, false);
  return s;
}
function roundedPolygonShape(points, radius) {
  const shape = new THREE.Shape();
  const n = points.length;
  for (let i = 0; i < n; i++) {
    const p = points[i], prev = points[(i - 1 + n) % n], next = points[(i + 1) % n];
    const d1 = new THREE.Vector2().subVectors(prev, p);
    const d2 = new THREE.Vector2().subVectors(next, p);
    const r1 = Math.min(radius, d1.length() * 0.5);
    const r2 = Math.min(radius, d2.length() * 0.5);
    const a = p.clone().addScaledVector(d1.normalize(), r1);
    const b = p.clone().addScaledVector(d2.normalize(), r2);
    if (i === 0) shape.moveTo(a.x, a.y); else shape.lineTo(a.x, a.y);
    shape.quadraticCurveTo(p.x, p.y, b.x, b.y);
  }
  shape.closePath();
  return shape;
}
function triangleShape(side, corner) {
  const Rc = side / Math.sqrt(3);   // circumradius, apex up, centered on the centroid
  return roundedPolygonShape([
    new THREE.Vector2(0, Rc),
    new THREE.Vector2(-side / 2, -Rc / 2),
    new THREE.Vector2(side / 2, -Rc / 2),
  ], corner);
}
function makeOutline(def) {
  switch (def.shape) {
    case 'hrect':
    case 'vrect':   return roundedRectShape(def.w, def.h, 0.06);
    case 'square':  return roundedRectShape(def.w, def.h, 0.1);
    case 'circle':  return circleShape(def.w / 2);
    case 'triangle':return triangleShape(def.w, 0.16);
    case 'arrow': {                              // rectangle ending in an outward arrowhead (+x)
      const a = Math.min(0.55, def.h * 0.6);
      return roundedPolygonShape([
        new THREE.Vector2(-def.w / 2, -def.h / 2),
        new THREE.Vector2(def.w / 2 - a, -def.h / 2),
        new THREE.Vector2(def.w / 2, 0),
        new THREE.Vector2(def.w / 2 - a, def.h / 2),
        new THREE.Vector2(-def.w / 2, def.h / 2),
      ], 0.05);
    }
  }
}
// Metal frame: outer contour with the board outline as its hole (FRAME_W wide)
function makeFrameGeometry(def, outline) {
  let outer;
  switch (def.shape) {
    case 'hrect':
    case 'vrect':   outer = roundedRectShape(def.w + 2 * FRAME_W, def.h + 2 * FRAME_W, 0.06 + FRAME_W); break;
    case 'square':  outer = roundedRectShape(def.w + 2 * FRAME_W, def.h + 2 * FRAME_W, 0.1 + FRAME_W); break;
    case 'circle':  outer = circleShape(def.w / 2 + FRAME_W); break;
    case 'triangle': {
      const Rin = def.w / (2 * Math.sqrt(3));   // inradius; a uniform outward offset equals scaling about the centroid
      const k = (Rin + FRAME_W) / Rin;
      outer = triangleShape(def.w * k, 0.16 * k);
      break;
    }
    case 'arrow': {
      const L = def.w + 2 * FRAME_W;
      const H = def.h + 2 * FRAME_W;
      const a = Math.min(0.55, def.h * 0.6) + FRAME_W;
      outer = roundedPolygonShape([
        new THREE.Vector2(-L / 2, -H / 2),
        new THREE.Vector2(L / 2 - a, -H / 2),
        new THREE.Vector2(L / 2, 0),
        new THREE.Vector2(L / 2 - a, H / 2),
        new THREE.Vector2(-L / 2, H / 2),
      ], 0.05 + FRAME_W);
      break;
    }
  }
  outer.holes.push(outline);
  return new THREE.ExtrudeGeometry(outer, { depth: FRAME_D, bevelEnabled: false, curveSegments: 48 });
}
// ShapeGeometry UVs are raw coordinates; normalize them to 0-1 so the image fills the face
function normalizeUVs(geo) {
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const sx = Math.max(1e-6, bb.max.x - bb.min.x);
  const sy = Math.max(1e-6, bb.max.y - bb.min.y);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) {
    uv.setXY(i, (pos.getX(i) - bb.min.x) / sx, (pos.getY(i) - bb.min.y) / sy);
  }
  uv.needsUpdate = true;
}

/* ---------------- Generated placeholder textures ---------------- */
// Multiply a hex color by a factor (used to deepen the placeholder gradients)
function shadeHex(hex, f) {
  var n = parseInt(hex.slice(1), 16);
  var r = Math.round(((n >> 16) & 255) * f);
  var g = Math.round(((n >> 8) & 255) * f);
  var b = Math.round((n & 255) * f);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function textureAspect(def) {
  if (def.shape === 'circle' || def.shape === 'square') return 1;
  if (def.shape === 'triangle') return Math.sqrt(3) / 2;
  return def.h / def.w;
}
function makePlaceholderTexture(def, index) {
  const W = 640, H = Math.round(W * textureAspect(def));
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, shadeHex(def.colorA, 0.9));
  g.addColorStop(1, shadeHex(def.colorB, 0.9));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // font sizes clamped by canvas height so very flat boards don't overflow
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '700 ' + Math.min(Math.round(W * 0.4), Math.round(H * 0.7)) + 'px "Avenir Next", Arial, sans-serif';
  ctx.fillText(String(index + 1).padStart(2, '0'), W / 2, H * 0.46);
  ctx.fillStyle = 'rgba(35,35,35,0.85)';
  ctx.font = '600 ' + Math.min(Math.round(W * 0.055), Math.round(H * 0.18)) + 'px "Avenir Next", Arial, sans-serif';
  ctx.fillText(def.label.split('').join(' '), W / 2, H * 0.8);
  ctx.fillStyle = 'rgba(35,35,35,0.4)';
  ctx.font = '500 ' + Math.min(Math.round(W * 0.03), Math.round(H * 0.12)) + 'px "Avenir Next", Arial, sans-serif';
  ctx.fillText('R E P L A C E   M E', W / 2, H * 0.13);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

/* ---------------- Assemble the signs ---------------- */
const signs = [];        // { pivot, group, anchor, def }
const pickMeshes = [];   // meshes participating in ray picking

SIGN_DEFS.forEach((def, i) => {
  const outline = makeOutline(def);

  const pivot = new THREE.Group();               // orientation around the pole
  pivot.rotation.y = THREE.MathUtils.degToRad(def.angle);
  pivot.position.y = def.y;
  root.add(pivot);

  // Horizontal rod lying IN the board's plane: from the pole out to the board's inner edge.
  // Centered boards (def.centered) sit straight on the pole instead, held by two studs.
  const zOff = POLE_R + 0.02;                    // board back plane sits just outside the pole
  const centered = !!def.centered;
  const innerX = POLE_R + def.arm;               // board inner edge
  const groupX = centered ? 0 : innerX + def.w / 2;

  const mountMeshes = [];
  if (centered) {
    const studGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.12, 12);
    [-1, 1].forEach((s) => {
      const stud = new THREE.Mesh(studGeo, matBlack);
      stud.rotation.x = Math.PI / 2;
      stud.position.set(s * 0.1, 0, POLE_R + 0.01);
      pivot.add(stud);
      mountMeshes.push(stud);
    });
  } else {
    const rodLen = def.arm + 0.10;               // embeds into the pole and the board edge
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, rodLen, 16), matBlack);
    rod.rotation.z = Math.PI / 2;
    rod.position.set((POLE_R - 0.06 + innerX + 0.04) / 2, 0, zOff + BOARD_D / 2);
    pivot.add(rod);
    mountMeshes.push(rod);
  }

  const group = new THREE.Group();               // board space: +z faces outward
  group.position.set(groupX, 0, zOff);
  pivot.add(group);

  // Board body (thin, the back face doubles as the light-gray metal back plate)
  const body = new THREE.Mesh(
    new THREE.ExtrudeGeometry(outline, { depth: BOARD_D, bevelEnabled: false, curveSegments: 48 }),
    matLightMetal
  );
  group.add(body);

  // Front face image on its own ShapeGeometry, avoiding ExtrudeGeometry's raw UVs
  const frontGeo = new THREE.ShapeGeometry(outline, 48);
  normalizeUVs(frontGeo);
  const frontMat = new THREE.MeshStandardMaterial({
    map: makePlaceholderTexture(def, i),
    roughness: 0.85,
    metalness: 0.0,
    envMapIntensity: 0.3,
  });
  if (def.image) {
    new THREE.TextureLoader().load(def.image, (t) => {
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 8;
      frontMat.map = t;
      frontMat.needsUpdate = true;
    });
  }
  const front = new THREE.Mesh(frontGeo, frontMat);
  front.position.z = BOARD_D + 0.002;
  group.add(front);

  // Light-gray metal frame, embedded into the board and slightly raised
  const frame = new THREE.Mesh(makeFrameGeometry(def, outline), matLightMetal);
  frame.position.z = BOARD_D + 0.03 - FRAME_D;
  group.add(frame);

  // Anchor at the board center: target of the focus animation
  const anchor = new THREE.Object3D();
  anchor.position.z = BOARD_D / 2;
  group.add(anchor);

  // Dark-gray clamp ring where the arm meets the pole
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.1, 36), matDarkMetal);
  ring.position.y = def.y;
  root.add(ring);

  [body, front, frame, ...mountMeshes].forEach((m) => {
    m.userData.signIndex = i;
    pickMeshes.push(m);
  });
  signs.push({ pivot, group, anchor, def });
});

/* ---------------- Controls: horizontal orbit only ---------------- */
function sphericalPos(az, dist) {
  return new THREE.Vector3(Math.sin(az) * dist, TARGET0.y, Math.cos(az) * dist);
}
function currentAzimuth() {
  return Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
}
function shortestAngle(d) {
  return Math.atan2(Math.sin(d), Math.cos(d));
}
function easeInOutCubic(k) {
  return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
}
function easeOutCubic(k) {
  return 1 - Math.pow(1 - k, 3);
}

const controls = new OrbitControls(camera, canvas);
controls.target.copy(TARGET0);
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.rotateSpeed = 0.55;
controls.minPolarAngle = Math.PI / 2;   // vertical angle locked
controls.maxPolarAngle = Math.PI / 2;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.enabled = false;               // enabled after the intro

/* ---------------- State machine and tweens ---------------- */
let mode = 'intro';        // intro | overview | focus | animating
let focused = -1;
let savedView = null;      // overview view captured before the first focus

const anims = new Set();
function animate(dur, onUpdate, onDone, ease = easeInOutCubic) {
  const a = { start: performance.now(), dur, onUpdate, onDone, ease };
  anims.add(a);
  return a;
}
function stepAnims(now) {
  for (const a of [...anims]) {
    const k = Math.min(1, (now - a.start) / a.dur);
    a.onUpdate(a.ease(k), k);
    if (k >= 1) {
      anims.delete(a);
      if (a.onDone) a.onDone();
    }
  }
}
function focusDistance(def) {
  return Math.max(def.w, def.h) * 1.35 + 1.55;
}

/* Intro: dolly the camera in */
camera.position.copy(sphericalPos(0.349, 15.5));
camera.lookAt(TARGET0);
animate(1400, (e) => {
  camera.position.lerpVectors(sphericalPos(0.349, 15.5), sphericalPos(0.349, 11.5), e);
  camera.lookAt(TARGET0);
}, () => {
  mode = 'overview';
  controls.enabled = true;
  controls.update();
}, easeOutCubic);

/* Focus: turn the whole rig, slide it left, face the board */
function focusSign(i) {
  if (mode === 'animating' || mode === 'intro') return;
  if (mode === 'focus' && i === focused) return;
  if (mode === 'overview') savedView = { az: currentAzimuth(), dist: camera.position.distanceTo(TARGET0) };

  focused = i;
  const def = signs[i].def;
  const a = THREE.MathUtils.degToRad(def.angle);
  const camAz = currentAzimuth();          // keep the camera heading, bring the rig around

  const R0 = root.rotation.y;
  const P0 = root.position.clone();
  let R1 = camAz - a;                      // so the sign normal points at camAz
  R1 = R0 + shortestAngle(R1 - R0);        // shortest path: back-side clicks turn to the front

  // Slide the rig left along the camera-right axis; the sign stays centered
  const shift = def.w * 0.55 + 1.2;
  const P1 = new THREE.Vector3(-Math.cos(camAz) * shift, 0, Math.sin(camAz) * shift);

  // Board center in root coordinates (side-mounted boards hang off the pole;
  // centered boards sit straight on it)
  const cxL = def.centered ? 0 : POLE_R + def.arm + def.w / 2;
  const czL = POLE_R + 0.02 + BOARD_D / 2;
  const anchorRoot = new THREE.Vector3(
    cxL * Math.cos(a) + czL * Math.sin(a),
    def.y,
    -cxL * Math.sin(a) + czL * Math.cos(a)
  );
  const anchorAt = (R, P) => anchorRoot.clone().applyAxisAngle(UP, R).add(P);

  const D = focusDistance(def);
  const center1 = anchorAt(R1, P1);
  const camPos1 = center1.clone().add(new THREE.Vector3(Math.sin(camAz) * D, 0, Math.cos(camAz) * D));

  const startPos = camera.position.clone();
  const startTgt = controls.target.clone();

  anims.clear();
  controls.enabled = false;
  mode = 'animating';

  animate(1150, (e) => {
    root.rotation.y = R0 + (R1 - R0) * e;
    root.position.lerpVectors(P0, P1, e);
    const center = anchorAt(root.rotation.y, root.position);   // target follows the board live
    camera.position.lerpVectors(startPos, camPos1, e);
    controls.target.lerpVectors(startTgt, center, e);
    camera.lookAt(controls.target);
  }, () => {
    mode = 'focus';
  });
}

/* Exit focus: restore the view saved before focusing */
function unfocus() {
  if (mode !== 'focus') return;
  const v = savedView || { az: 0.349, dist: 11.5 };
  const endPos = sphericalPos(v.az, v.dist);
  const startPos = camera.position.clone();
  const startTgt = controls.target.clone();
  const R0 = root.rotation.y;
  const P0 = root.position.clone();

  anims.clear();
  mode = 'animating';
  focused = -1;

  animate(1050, (e) => {
    root.rotation.y = R0 * (1 - e);
    root.position.lerpVectors(P0, ORIGIN, e);
    camera.position.lerpVectors(startPos, endPos, e);
    controls.target.lerpVectors(startTgt, TARGET0, e);
    camera.lookAt(controls.target);
  }, () => {
    mode = 'overview';
    focused = -1;
    controls.enabled = true;
    controls.update();
  });
}

/* ---------------- Picking (click vs drag) ---------------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downX = 0, downY = 0, downId = -1, dragged = false;

function raycastSign(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickMeshes, false);
  return hits.length ? hits[0].object.userData.signIndex : -1;
}
function pick(e) {
  if (mode === 'animating' || mode === 'intro') return;
  const i = raycastSign(e);
  if (i >= 0) {
    focusSign(i);            // clicking a sign focuses or switches focus
  } else if (mode === 'focus') {
    unfocus();               // clicking empty space exits
  }
}
canvas.addEventListener('pointerdown', (e) => {
  if (!e.isPrimary) return;
  downX = e.clientX; downY = e.clientY;
  downId = e.pointerId;
  dragged = false;
});
canvas.addEventListener('pointermove', (e) => {
  if (e.isPrimary && e.pointerId === downId &&
      Math.hypot(e.clientX - downX, e.clientY - downY) > 6) dragged = true;
  if (mode === 'animating' || mode === 'intro') { canvas.style.cursor = 'default'; return; }
  canvas.style.cursor = raycastSign(e) >= 0 ? 'pointer' : (mode === 'overview' ? 'grab' : 'default');
});
canvas.addEventListener('pointerup', (e) => {
  if (!e.isPrimary || e.pointerId !== downId) return;
  downId = -1;
  if (dragged) return;
  pick(e);
});
canvas.addEventListener('pointercancel', () => { downId = -1; });
addEventListener('keydown', (e) => { if (e.key === 'Escape') unfocus(); });

/* ---------------- Main loop ---------------- */
renderer.setAnimationLoop((now) => {
  stepAnims(now);
  if (mode === 'overview') controls.update();   // camera is tween-driven otherwise
  renderer.render(scene, camera);
});
document.getElementById('loading').classList.add('done');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Debug handle (available in the console)
window.__SIGNPOST_DEBUG__ = { scene, camera, controls, root, signs, pickMeshes, raycaster };
</script>
